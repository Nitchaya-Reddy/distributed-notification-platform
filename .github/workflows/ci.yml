name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate helper scripts
        run: |
          python3 -m py_compile scripts/load-test.py
          bash -n scripts/smoke-test.sh scripts/load-test.sh
      - name: Verify
        run: mvn -B verify
      - name: Build API image
        run: docker build -f Dockerfile.api -t notification-api:${{ github.sha }} .
      - name: Build Worker image
        run: docker build -f Dockerfile.worker -t notification-worker:${{ github.sha }} .
