apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: notifications
data:
  DB_URL: jdbc:postgresql://YOUR_POSTGRES_HOST:5432/notifications
  KAFKA_BOOTSTRAP_SERVERS: YOUR_KAFKA_BOOTSTRAP_SERVERS
  REDIS_HOST: YOUR_REDIS_HOST
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: notifications
type: Opaque
stringData:
  DB_USER: replace-me
  DB_PASSWORD: replace-me
