apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: notifications
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-api }
  template:
    metadata:
      labels: { app: notification-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USERNAME/notification-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: notification-config }
            - secretRef: { name: notification-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: notifications
spec:
  selector: { app: notification-api }
  ports:
    - port: 80
      targetPort: 8080
